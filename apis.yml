name: Gravity
description: 'Gravity (Gravity Technologies) builds and deploys ultra-fast DC electric-vehicle
  charging infrastructure for dense urban environments. Its Distributed Energy Access
  Points (DEAPs) deliver up to five-minute charges from compact, modular hardware that
  requires minimal real estate and no dedicated utility upgrade, letting operators
  place high-power charging in garages, curbside, and fleet depots. The company was
  surfaced as a portfolio company of GV and Redpoint Ventures and added to the API
  Evangelist network for enrichment; it publishes no public developer portal, API,
  or SDKs at this time, so this profile captures company identity and the domain
  security surface rather than API artifacts.'
